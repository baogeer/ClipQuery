; -----------------------------------------------------------------------------
; ClipQuery 容器内进程编排
;
; 只跑 API 一个常驻服务，uvicorn 内部多 worker：
;   - 每个 worker 启动时 WorkerRuntime 自动注册到 OpenSearch hash 环
;   - 每个 worker 内部挂 APScheduler，按 hash 环归属抢任务
;   - CGTN 定时扫描由任何活跃 worker 触发；hash 过滤保证同一 URL 只由一个 worker 入库
;
; 若需要单独跑一次性批处理，不走 supervisord（docker run 覆盖 CMD）即可。
; -----------------------------------------------------------------------------

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:clipquery-api]
command=/usr/local/bin/uvicorn clipquery.api.main:app --host 0.0.0.0 --port 8000 --workers %(ENV_CLIPQUERY_UVICORN_WORKERS)s
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; --workers 由环境变量 CLIPQUERY_UVICORN_WORKERS 控制（Dockerfile ENV 默认 3）。
; 任务状态都在 OpenSearch 的 clipquery_tasks，多 worker 安全。
